# =============================================================================
#  Tagomi Commerce API — Sample OpenAPI 3.1 Specification
# =============================================================================
#  A deliberately feature-rich example that exercises most of the OpenAPI 3.1
#  specification, including:
#    - Server variables and multiple environments
#    - Multiple security schemes (OAuth2, JWT bearer, API key) with scopes
#    - Reusable components (schemas, parameters, responses, headers, examples,
#      request bodies, links, callbacks)
#    - Polymorphism via oneOf / allOf / discriminator
#    - Cursor-based pagination, filtering, sorting, sparse fieldsets
#    - Idempotency keys, optimistic concurrency (ETag / If-Match)
#    - RFC 9457 problem+json error responses
#    - File upload (multipart/form-data)
#    - Callbacks and top-level webhooks
#    - Vendor extensions (x-*)
# =============================================================================

openapi: 3.1.0

jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base

# -----------------------------------------------------------------------------
#  API metadata
# -----------------------------------------------------------------------------
info:
  title: Tagomi Commerce API
  version: 2.4.0
  summary: Manage products, customers, orders and payments for Tagomi online stores.
  description: |
    The **Tagomi Commerce API** enables both partners and internal services to manage the full transaction lifecycle in a Tagomi online store. <br />(This sample API specification was generated by Claude Code. I edited the specification to ensure that the documentation text is clear and concise, but left the original text where it seemed completely acceptable.)

    ## Conventions
    - All timestamps are [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339) in UTC.
    - All monetary amounts are integers in the currency's **minor unit**. For example, USD amounts are expressed in cents.
      Typical example: `1999` = $19.99 USD.
    - Identifiers are opaque, prefixed strings (`prd_`, `cus_`, `ord_`, `pay_`).
    - Collection endpoints use **cursor pagination** (see `Pagination` below).

    ## Rate limiting
    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
    `X-RateLimit-Reset` headers. Exceeding the limit returns a `429` error.

    ## Idempotency
    `POST` requests accept an `Idempotency-Key` header. Resending a request
    with the same key within 24 hours returns the original response.

    ## Errors
    Errors use `application/problem+json` as defined by
    [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457).
  termsOfService: https://Tagomi.example.com/legal/terms
  contact:
    name: Tagomi API Support
    url: https://developers.Tagomi.example.com/support
    email: api-support@Tagomi.example.com
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  x-logo:
    url: https://Tagomi.example.com/assets/logo.svg
    altText: Tagomi logo

# -----------------------------------------------------------------------------
#  Servers
# -----------------------------------------------------------------------------
servers:
  - url: https://{region}.api.Tagomi.example.com/{basePath}
    description: Production (regional)
    variables:
      region:
        description: Data-residency region the tenant is provisioned in.
        default: us
        enum: [us, eu, ap]
      basePath:
        description: API version prefix.
        default: v2
  - url: https://sandbox.api.Tagomi.example.com/v2
    description: Sandbox — test data only. No real transactions are made.
  - url: http://localhost:8080/v2
    description: Local development

# -----------------------------------------------------------------------------
#  Global security (can be overridden per operation)
# -----------------------------------------------------------------------------
security:
  - OAuth2: []
  - BearerAuth: []

# -----------------------------------------------------------------------------
#  Tags (single-sourcing for documentation tools)
# -----------------------------------------------------------------------------
tags:
  - name: Products
    description: Catalogue items available for sale.
  - name: Customers
    description: People or organisations that purchase products.
  - name: Orders
    description: Purchases made by customers, including line items and fulfilment.
  - name: Payments
    description: Charges and refunds associated with orders.
  - name: Health
    description: Service status endpoints. No authentication required.

externalDocs:
  description: Full developer guide
  url: https://developers.Tagomi.example.com/docs

# =============================================================================
#  PATHS
# =============================================================================
paths:

  # ---------------------------------------------------------------------------
  #  Health
  # ---------------------------------------------------------------------------
  /health:
    get:
      operationId: getHealth
      summary: Service health check
      description: Returns the health of the API and its dependencies.
      tags: [Health]
      security: []          # Public endpoint — overrides global security
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                version: 2.4.0
                checks:
                  database: ok
                  cache: ok
        '503':
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # ---------------------------------------------------------------------------
  #  Products
  # ---------------------------------------------------------------------------
  /products:
    get:
      operationId: listProducts
      summary: List products
      description: |
        Returns a paginated list of products. This can be filtered by
        category, price range and status. It can be sorted by any sortable field.
      tags: [Products]
      security:
        - OAuth2: [products:read]
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Fields'
        - name: category
          in: query
          description: Filter by one or more category slugs.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              pattern: '^[a-z0-9-]+$'
          example: [electronics, audio]
        - name: status
          in: query
          description: Filter by product status.
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: price
          in: query
          description: |
            Price range filter in minor units, using deepObject style.
            For example: `price[gte]=1000&price[lte]=5000`. (The minor unit is the smallest denomination in the relevant currency, such as cents for USD.)
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              gte:
                type: integer
                minimum: 0
              lte:
                type: integer
                minimum: 0
            additionalProperties: false
        - name: sort
          in: query
          description: |
            Sort field. Prefix with `-` for descending order.
          schema:
            type: string
            enum: [name, -name, price, -price, createdAt, -createdAt]
            default: -createdAt
      responses:
        '200':
          description: A page of products.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              examples:
                firstPage:
                  $ref: '#/components/examples/ProductPageExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      operationId: createProduct
      summary: Create a product
      description: Adds a new product to the catalogue.
      tags: [Products]
      security:
        - OAuth2: [products:write]
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ProductCreate'
      responses:
        '201':
          description: Product created.
          headers:
            Location:
              description: URL of the newly created product.
              schema:
                type: string
                format: uri
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          links:
            GetProductById:
              $ref: '#/components/links/GetProductById'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    get:
      operationId: getProduct
      summary: Retrieve a product from the catalogue
      tags: [Products]
      security:
        - OAuth2: [products:read]
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Fields'
        - name: If-None-Match
          in: header
          description: Return `304` if the product's ETag matches.
          schema:
            type: string
      responses:
        '200':
          description: The requested product.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                physical:
                  $ref: '#/components/examples/PhysicalProductExample'
                digital:
                  $ref: '#/components/examples/DigitalProductExample'
        '304':
          description: Not modified — the cached representation is current.
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateProduct
      summary: Update a product in the catalogue
      description: |
        Partially updates a product using
        [JSON Merge Patch](https://www.rfc-editor.org/rfc/rfc7396).
        Requires an `If-Match` header to prevent lost updates.
      tags: [Products]
      security:
        - OAuth2: [products:write]
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
            example:
              price:
                amount: 2499
              status: active
      responses:
        '200':
          description: Product updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteProduct
      summary: Archive a product in the catalogue
      description: |
        Archives the product by soft-deleting it. Archived products remain visible in past
        orders, but can no longer be purchased.
      tags: [Products]
      security:
        - OAuth2: [products:write]
      responses:
        '204':
          description: Product archived.
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{productId}/images:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: uploadProductImage
      summary: Upload a product image
      tags: [Products]
      security:
        - OAuth2: [products:write]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: image/*
                  description: JPEG, PNG or WebP image, max 10 MB.
                altText:
                  type: string
                  maxLength: 250
                  description: Accessible description of the image.
                position:
                  type: integer
                  minimum: 0
                  description: Display order; `0` is the primary image.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Image uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '413':
          description: File exceeds the 10 MB limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported image type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ---------------------------------------------------------------------------
  #  Customers
  # ---------------------------------------------------------------------------
  /customers:
    get:
      operationId: listCustomers
      summary: List customers
      tags: [Customers]
      security:
        - OAuth2: [customers:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: email
          in: query
          description: Exact-match filter on email address.
          schema:
            type: string
            format: email
        - name: createdAfter
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createCustomer
      summary: Create a customer
      tags: [Customers]
      security:
        - OAuth2: [customers:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            examples:
              individual:
                summary: Individual customer
                value:
                  type: individual
                  email: jane.doe@example.com
                  firstName: Jane
                  lastName: Doe
              business:
                summary: Business customer
                value:
                  type: business
                  email: procurement@globex.example.com
                  companyName: Globex Corporation
                  vatNumber: GB123456789
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      operationId: getCustomer
      summary: Retrieve a customer
      tags: [Customers]
      security:
        - OAuth2: [customers:read]
      responses:
        '200':
          description: The requested customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          links:
            CustomerOrders:
              operationId: listOrders
              parameters:
                customerId: $response.body#/id
              description: List all orders placed by this customer.
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  #  Orders
  # ---------------------------------------------------------------------------
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      tags: [Orders]
      security:
        - OAuth2: [orders:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: customerId
          in: query
          schema:
            $ref: '#/components/schemas/CustomerIdValue'
        - name: status
          in: query
          description: One or more order statuses (comma-separated).
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'

    post:
      operationId: createOrder
      summary: Place an order
      description: |
        Creates an order with `pending` status. Optionally, register a
        `statusCallbackUrl` to receive status-change notifications for this
        specific order. (See the **Callbacks** section for more information.)
      tags: [Orders]
      security:
        - OAuth2: [orders:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            example:
              customerId: cus_8f2kLm91
              currency: USD
              lineItems:
                - productId: prd_1a2b3c4d
                  quantity: 2
              shippingAddress:
                line1: 1 Infinite Loop
                city: Cupertino
                region: CA
                postalCode: '95014'
                country: US
              statusCallbackUrl: https://partner.example.com/hooks/Tagomi
      callbacks:
        orderStatusChanged:
          $ref: '#/components/callbacks/OrderStatusChanged'
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          links:
            PayForOrder:
              operationId: createPayment
              requestBody:
                orderId: $response.body#/id
              description: Create a payment for the newly placed order.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Retrieve an order
      tags: [Orders]
      security:
        - OAuth2: [orders:read]
      parameters:
        - name: expand
          in: query
          description: Related resources to embed inline instead of returning IDs.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              enum: [customer, lineItems.product, payments]
      responses:
        '200':
          description: The requested order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: cancelOrder
      summary: Cancel an order
      description: |
        Cancels an order that has not yet shipped. Any captured payments are
        automatically refunded.
      tags: [Orders]
      security:
        - OAuth2: [orders:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [customer_request, fraud, out_of_stock, other]
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Order has already shipped and cannot be cancelled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://Tagomi.example.com/problems/order-not-cancellable
                title: Order cannot be cancelled
                status: 409
                detail: Order ord_77xyQ has status 'shipped'.
                instance: /orders/ord_77xyQ/cancel

  # ---------------------------------------------------------------------------
  #  Payments
  # ---------------------------------------------------------------------------
  /payments:
    post:
      operationId: createPayment
      summary: Create a payment
      description: |
        Charges a payment method for an order. The `method` object is
        polymorphic — its shape depends on `method.type`.
      tags: [Payments]
      security:
        - OAuth2: [payments:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            examples:
              card:
                summary: Card payment
                value:
                  orderId: ord_77xyQ
                  amount: { amount: 4998, currency: USD }
                  method:
                    type: card
                    token: tok_visa_4242
                    threeDSecure: true
              bankTransfer:
                summary: Bank transfer
                value:
                  orderId: ord_77xyQ
                  amount: { amount: 4998, currency: EUR }
                  method:
                    type: bank_transfer
                    iban: DE89370400440532013000
                    accountHolder: Jane Doe
              wallet:
                summary: Digital wallet
                value:
                  orderId: ord_77xyQ
                  amount: { amount: 4998, currency: USD }
                  method:
                    type: wallet
                    provider: apple_pay
                    walletToken: eyJhbGciOi...
      responses:
        '201':
          description: Payment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '402':
          description: Payment was declined.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      declineCode:
                        type: string
                        enum: [insufficient_funds, card_expired, do_not_honor, fraud_suspected]
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /payments/{paymentId}/refunds:
    parameters:
      - name: paymentId
        in: path
        required: true
        description: Payment identifier.
        schema:
          type: string
          pattern: '^pay_[A-Za-z0-9]{8,}$'
    post:
      operationId: refundPayment
      summary: Refund a payment
      description: Issues a full or partial refund. Omit `amount` for a full refund.
      tags: [Payments]
      security:
        - OAuth2: [payments:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  $ref: '#/components/schemas/Money'
                reason:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Refund issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '409':
          description: Refund exceeds the remaining refundable amount.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

# =============================================================================
#  WEBHOOKS  (OpenAPI 3.1 — events Tagomi sends to subscribers)
# =============================================================================
webhooks:
  order.created:
    post:
      operationId: onOrderCreated
      summary: Order created event
      description: Sent to all subscribed endpoints when a new order is placed.
      tags: [Orders]
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '2XX':
          description: Event acknowledged. Any 2xx status is accepted.
        default:
          description: |
            Any non-2xx response triggers retries with exponential backoff
            for up to 72 hours.

  payment.failed:
    post:
      operationId: onPaymentFailed
      summary: Payment failed event
      tags: [Payments]
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '2XX':
          description: Event acknowledged.

# =============================================================================
#  COMPONENTS
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  #  Security schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth 2.0. Use **client credentials** for server-to-server access and
        **authorization code + PKCE** for user-delegated access.
      flows:
        clientCredentials:
          tokenUrl: https://auth.Tagomi.example.com/oauth/token
          scopes: &scopes
            products:read: Read the product catalogue
            products:write: Create, update and archive products
            customers:read: Read customer records
            customers:write: Create and update customers
            orders:read: Read orders
            orders:write: Create and cancel orders
            payments:write: Create payments and refunds
        authorizationCode:
          authorizationUrl: https://auth.Tagomi.example.com/oauth/authorize
          tokenUrl: https://auth.Tagomi.example.com/oauth/token
          refreshUrl: https://auth.Tagomi.example.com/oauth/token
          scopes: *scopes
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A short-lived JWT issued by the Tagomi identity service.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Read-only API key for public catalogue access.

  # ---------------------------------------------------------------------------
  #  Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # --- Primitives & value objects -----------------------------------------
    ProductIdValue:
      type: string
      pattern: '^prd_[A-Za-z0-9]{8,}$'
      description: Product identifier.
      examples: [prd_1a2b3c4d]

    CustomerIdValue:
      type: string
      pattern: '^cus_[A-Za-z0-9]{8,}$'
      description: Customer identifier.
      examples: [cus_8f2kLm91]

    OrderIdValue:
      type: string
      pattern: '^ord_[A-Za-z0-9]{5,}$'
      description: Order identifier.
      examples: [ord_77xyQ]

    CurrencyCode:
      type: string
      description: ISO 4217 three-letter currency code.
      pattern: '^[A-Z]{3}$'
      examples: [USD, EUR, GBP]

    Money:
      type: object
      description: A monetary amount in the currency's minor unit. (The minor unit is the smallest denomination in the relevant currency, such as cents for USD.)
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Amount in minor units (for example, cents).
          examples: [1999]
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    Address:
      type: object
      required: [line1, city, postalCode, country]
      properties:
        line1:
          type: string
          maxLength: 200
        line2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          description: State, province or county.
        postalCode:
          type: string
          maxLength: 20
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code.

    Timestamps:
      type: object
      description: Audit timestamps shared by all resources.
      properties:
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Metadata:
      type: object
      description: |
        Up to 50 arbitrary key/value pairs for your own use. Keys are limited
        to 40 characters. Values are limitedto 500 characters.
      maxProperties: 50
      propertyNames:
        maxLength: 40
      additionalProperties:
        type: string
        maxLength: 500

    # --- Health -------------------------------------------------------------
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, degraded, down]

    # --- Pagination ---------------------------------------------------------
    PageInfo:
      type: object
      description: Cursor pagination metadata.
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
          description: Whether more results exist after this page.
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` to fetch the next page.
        totalCount:
          type: integer
          description: Approximate total number of matching records.

    # --- Products -----------------------------------------------------------
    ProductStatus:
      type: string
      enum: [draft, active, archived]
      description: |
        - `draft` — not visible to shoppers
        - `active` — available for purchase
        - `archived` — soft-deleted (retired) but retained for order history

    Image:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        altText:
          type: string
        position:
          type: integer
          minimum: 0

    ProductBase:
      type: object
      description: Fields common to all product kinds.
      required: [name, kind, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          description: Markdown-formatted long description.
        kind:
          type: string
          enum: [physical, digital]
          description: Discriminator for the product subtype.
        price:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/ProductStatus'
        categories:
          type: array
          uniqueItems: true
          maxItems: 10
          items:
            type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    PhysicalProduct:
      description: A tangible product that must be shipped.
      allOf:
        - $ref: '#/components/schemas/ProductBase'
        - type: object
          required: [sku, weightGrams]
          properties:
            kind:
              const: physical
            sku:
              type: string
              pattern: '^[A-Z0-9-]{4,32}$'
            weightGrams:
              type: integer
              minimum: 1
            dimensions:
              type: object
              properties:
                lengthMm: { type: integer, minimum: 1 }
                widthMm:  { type: integer, minimum: 1 }
                heightMm: { type: integer, minimum: 1 }
            inventory:
              type: integer
              minimum: 0
              description: Units in stock.

    DigitalProduct:
      description: A downloadable or licensed product.
      allOf:
        - $ref: '#/components/schemas/ProductBase'
        - type: object
          required: [deliveryMethod]
          properties:
            kind:
              const: digital
            deliveryMethod:
              type: string
              enum: [download, license_key, streaming]
            fileSizeBytes:
              type: integer
              format: int64
            licenseSeats:
              type: integer
              minimum: 1

    Product:
      description: A product as returned by the API (read model).
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              allOf:
                - $ref: '#/components/schemas/ProductIdValue'
              readOnly: true
            images:
              type: array
              readOnly: true
              items:
                $ref: '#/components/schemas/Image'
        - oneOf:
            - $ref: '#/components/schemas/PhysicalProduct'
            - $ref: '#/components/schemas/DigitalProduct'
          discriminator:
            propertyName: kind
            mapping:
              physical: '#/components/schemas/PhysicalProduct'
              digital: '#/components/schemas/DigitalProduct'
        - $ref: '#/components/schemas/Timestamps'

    ProductCreate:
      description: Payload for creating a product.
      oneOf:
        - $ref: '#/components/schemas/PhysicalProduct'
        - $ref: '#/components/schemas/DigitalProduct'
      discriminator:
        propertyName: kind
        mapping:
          physical: '#/components/schemas/PhysicalProduct'
          digital: '#/components/schemas/DigitalProduct'

    ProductUpdate:
      type: object
      description: JSON Merge Patch for a product. Set a field to `null` to clear it.
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: [string, 'null']
        price:
          type: object
          properties:
            amount:
              type: integer
              minimum: 0
        status:
          $ref: '#/components/schemas/ProductStatus'
        categories:
          type: [array, 'null']
          items:
            type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    ProductPage:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    # --- Customers ----------------------------------------------------------
    CustomerCreate:
      description: |
        A customer is either an individual or a business. The `type` field
        determines which properties are required.
      oneOf:
        - title: IndividualCustomer
          type: object
          required: [type, email, firstName, lastName]
          properties:
            type:
              const: individual
            email:
              type: string
              format: email
            firstName:
              type: string
              maxLength: 100
            lastName:
              type: string
              maxLength: 100
            phone:
              type: string
              pattern: '^\+[1-9]\d{6,14}$'
              description: E.164 formatted phone number.
            dateOfBirth:
              type: string
              format: date
        - title: BusinessCustomer
          type: object
          required: [type, email, companyName]
          properties:
            type:
              const: business
            email:
              type: string
              format: email
            companyName:
              type: string
              maxLength: 200
            vatNumber:
              type: string
              description: EU/UK VAT registration number.
      discriminator:
        propertyName: type

    Customer:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              allOf:
                - $ref: '#/components/schemas/CustomerIdValue'
              readOnly: true
            defaultShippingAddress:
              $ref: '#/components/schemas/Address'
            lifetimeValue:
              allOf:
                - $ref: '#/components/schemas/Money'
              readOnly: true
              description: Total amount spent across all completed orders.
            marketingConsent:
              type: boolean
              default: false
            password:
              type: string
              format: password
              writeOnly: true
              minLength: 12
              description: Only accepted on create; never returned.
        - $ref: '#/components/schemas/CustomerCreate'
        - $ref: '#/components/schemas/Timestamps'

    CustomerPage:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    # --- Orders -------------------------------------------------------------
    OrderStatus:
      type: string
      enum: [pending, paid, fulfilled, shipped, delivered, cancelled, refunded]
      x-enum-descriptions:
        pending: Awaiting payment.
        paid: Payment captured-awaiting fulfilment.
        fulfilled: Packed and ready to ship.
        shipped: Handed to the carrier.
        delivered: Confirmed delivered.
        cancelled: Cancelled before shipment.
        refunded: Fully refunded after payment.

    LineItem:
      type: object
      required: [productId, quantity]
      properties:
        id:
          type: string
          readOnly: true
        productId:
          $ref: '#/components/schemas/ProductIdValue'
        quantity:
          type: integer
          minimum: 1
          maximum: 999
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          readOnly: true
          description: Snapshot of the price at the time the order was placed.
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          readOnly: true

    OrderCreate:
      type: object
      required: [customerId, currency, lineItems]
      properties:
        customerId:
          $ref: '#/components/schemas/CustomerIdValue'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        lineItems:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/LineItem'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        couponCode:
          type: string
          pattern: '^[A-Z0-9]{4,16}$'
        statusCallbackUrl:
          type: string
          format: uri
          description: Optional URL to receive order status callbacks.
        metadata:
          $ref: '#/components/schemas/Metadata'
      dependentRequired:
        # A coupon only makes sense for orders that will be shipped and taxed.
        couponCode: [shippingAddress]

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderCreate'
        - type: object
          required: [id, status, totals]
          properties:
            id:
              allOf:
                - $ref: '#/components/schemas/OrderIdValue'
              readOnly: true
            status:
              $ref: '#/components/schemas/OrderStatus'
            totals:
              type: object
              readOnly: true
              required: [subtotal, tax, shipping, discount, grandTotal]
              properties:
                subtotal:   { $ref: '#/components/schemas/Money' }
                tax:        { $ref: '#/components/schemas/Money' }
                shipping:   { $ref: '#/components/schemas/Money' }
                discount:   { $ref: '#/components/schemas/Money' }
                grandTotal: { $ref: '#/components/schemas/Money' }
            trackingNumber:
              type: [string, 'null']
              readOnly: true
        - $ref: '#/components/schemas/Timestamps'

    OrderPage:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    # --- Payments -----------------------------------------------------------
    CardMethod:
      type: object
      required: [type, token]
      properties:
        type:
          const: card
        token:
          type: string
          description: Tokenised card from the Tagomi.js client library.
        threeDSecure:
          type: boolean
          default: true

    BankTransferMethod:
      type: object
      required: [type, iban, accountHolder]
      properties:
        type:
          const: bank_transfer
        iban:
          type: string
          pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'
        accountHolder:
          type: string

    WalletMethod:
      type: object
      required: [type, provider, walletToken]
      properties:
        type:
          const: wallet
        provider:
          type: string
          enum: [apple_pay, google_pay, paypal]
        walletToken:
          type: string

    PaymentMethod:
      oneOf:
        - $ref: '#/components/schemas/CardMethod'
        - $ref: '#/components/schemas/BankTransferMethod'
        - $ref: '#/components/schemas/WalletMethod'
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/CardMethod'
          bank_transfer: '#/components/schemas/BankTransferMethod'
          wallet: '#/components/schemas/WalletMethod'

    PaymentCreate:
      type: object
      required: [orderId, amount, method]
      properties:
        orderId:
          $ref: '#/components/schemas/OrderIdValue'
        amount:
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        capture:
          type: boolean
          default: true
          description: Set to `false` to authorise only and capture later.

    Payment:
      allOf:
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
              readOnly: true
              pattern: '^pay_[A-Za-z0-9]{8,}$'
            status:
              type: string
              enum: [requires_action, authorized, captured, failed, refunded, partially_refunded]
            nextAction:
              type: [object, 'null']
              description: Present when `status` is `requires_action`. (For example, 3-D Secure.)
              properties:
                type:
                  type: string
                  enum: [redirect]
                redirectUrl:
                  type: string
                  format: uri
            method:
              description: Payment method with sensitive fields removed.
              type: object
              properties:
                type:
                  type: string
                last4:
                  type: string
                  pattern: '^[0-9]{4}$'
        - $ref: '#/components/schemas/PaymentCreate'
        - $ref: '#/components/schemas/Timestamps'

    Refund:
      type: object
      required: [id, paymentId, amount, status]
      properties:
        id:
          type: string
          readOnly: true
        paymentId:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [pending, succeeded, failed]
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    # --- Events -------------------------------------------------------------
    WebhookEvent:
      type: object
      description: Envelope for all webhook and callback deliveries.
      required: [id, type, createdAt, data]
      properties:
        id:
          type: string
          description: Unique event ID — use it to deduplicate deliveries.
        type:
          type: string
          enum: [order.created, order.status_changed, payment.failed]
        createdAt:
          type: string
          format: date-time
        apiVersion:
          type: string
          examples: ['2.4.0']
        data:
          type: object
          description: The resource snapshot at the time of the event.
          oneOf:
            - $ref: '#/components/schemas/Order'
            - $ref: '#/components/schemas/Payment'

    # --- Errors -------------------------------------------------------------
    Problem:
      type: object
      description: RFC 9457 Problem Details object.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation of the problem, specific to this occurrence.
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
          description: Correlation ID for support requests.
      additionalProperties: true

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [pointer, message]
                properties:
                  pointer:
                    type: string
                    description: JSON Pointer to the offending field.
                    examples: ['/lineItems/0/quantity']
                  message:
                    type: string
                  code:
                    type: string

  # ---------------------------------------------------------------------------
  #  Parameters
  # ---------------------------------------------------------------------------
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: Product identifier.
      schema:
        $ref: '#/components/schemas/ProductIdValue'
    CustomerId:
      name: customerId
      in: path
      required: true
      description: Customer identifier.
      schema:
        $ref: '#/components/schemas/CustomerIdValue'
    OrderId:
      name: orderId
      in: path
      required: true
      description: Order identifier.
      schema:
        $ref: '#/components/schemas/OrderIdValue'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `pageInfo.nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Fields:
      name: fields
      in: query
      description: Comma-separated sparse fieldset, e.g. `id,name,price`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Unique key (UUID recommended) to make the request safely retryable.
      schema:
        type: string
        format: uuid
      example: 3f1c8e1a-7b4d-4c9e-9a51-0e2b7f6d8c11
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being modified.
      schema:
        type: string
    WebhookSignature:
      name: Tagomi-Signature
      in: header
      required: true
      description: |
        HMAC-SHA256 of `{timestamp}.{raw body}` using your endpoint secret,
        formatted as `t=<unix>,v1=<hex digest>`.
      schema:
        type: string
        pattern: '^t=\d+,v1=[a-f0-9]{64}$'

  # ---------------------------------------------------------------------------
  #  Headers
  # ---------------------------------------------------------------------------
  headers:
    ETag:
      description: Entity tag for the current representation.
      schema:
        type: string
    X-RateLimit-Limit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix time when the current window resets.
      schema:
        type: integer
        format: int64
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  # ---------------------------------------------------------------------------
  #  Request bodies
  # ---------------------------------------------------------------------------
  requestBodies:
    ProductCreate:
      required: true
      description: The product to create. Shape depends on `kind`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductCreate'
          examples:
            physical:
              summary: Physical product
              value:
                kind: physical
                name: Wireless Headphones
                sku: WH-1000-BLK
                weightGrams: 250
                price: { amount: 19999, currency: USD }
                categories: [electronics, audio]
            digital:
              summary: Digital product
              value:
                kind: digital
                name: Photo Editor Pro (1 year)
                deliveryMethod: license_key
                licenseSeats: 1
                price: { amount: 4999, currency: USD }

  # ---------------------------------------------------------------------------
  #  Responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://Tagomi.example.com/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: The access token has expired.
    Forbidden:
      description: The credentials lack the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://Tagomi.example.com/problems/not-found
            title: Resource not found
            status: 404
    Conflict:
      description: The request conflicts with the current state. (For example, a duplicate SKU.)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The `If-Match` ETag does not match the current version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The request was well-formed but failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: https://Tagomi.example.com/problems/validation
            title: Validation failed
            status: 422
            errors:
              - pointer: /lineItems/0/quantity
                message: must be greater than or equal to 1
                code: minimum
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  # ---------------------------------------------------------------------------
  #  Examples
  # ---------------------------------------------------------------------------
  examples:
    PhysicalProductExample:
      summary: A physical product
      value:
        id: prd_1a2b3c4d
        kind: physical
        name: Wireless Headphones
        sku: WH-1000-BLK
        weightGrams: 250
        inventory: 142
        price: { amount: 19999, currency: USD }
        status: active
        categories: [electronics, audio]
        images:
          - id: img_01
            url: https://cdn.Tagomi.example.com/p/wh1000.jpg
            altText: Black over-ear headphones
            position: 0
        createdAt: '2026-03-01T10:15:00Z'
        updatedAt: '2026-09-20T08:00:00Z'
    DigitalProductExample:
      summary: A digital product
      value:
        id: prd_9z8y7x6w
        kind: digital
        name: Photo Editor Pro (1 year)
        deliveryMethod: license_key
        licenseSeats: 1
        price: { amount: 4999, currency: USD }
        status: active
        createdAt: '2026-01-12T09:00:00Z'
        updatedAt: '2026-01-12T09:00:00Z'
    ProductPageExample:
      summary: First page of products
      value:
        data:
          - id: prd_1a2b3c4d
            kind: physical
            name: Wireless Headphones
            sku: WH-1000-BLK
            weightGrams: 250
            price: { amount: 19999, currency: USD }
            status: active
        pageInfo:
          hasMore: true
          nextCursor: eyJpZCI6InByZF8xYTJiM2M0ZCJ9
          totalCount: 318

  # ---------------------------------------------------------------------------
  #  Links
  # ---------------------------------------------------------------------------
  links:
    GetProductById:
      operationId: getProduct
      parameters:
        productId: $response.body#/id
      description: Retrieve the product that was just created.

  # ---------------------------------------------------------------------------
  #  Callbacks
  # ---------------------------------------------------------------------------
  callbacks:
    OrderStatusChanged:
      '{$request.body#/statusCallbackUrl}':
        post:
          operationId: onOrderStatusChanged
          summary: Order status changed
          description: |
            Each time the order's status changes, this is sent to the `statusCallbackUrl` supplied when the order was
            created.
          parameters:
            - $ref: '#/components/parameters/WebhookSignature'
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WebhookEvent'
                example:
                  id: evt_5Hq2
                  type: order.status_changed
                  createdAt: '2026-10-11T14:22:05Z'
                  apiVersion: 2.4.0
                  data:
                    id: ord_77xyQ
                    status: shipped
                    customerId: cus_8f2kLm91
                    currency: USD
                    lineItems:
                      - productId: prd_1a2b3c4d
                        quantity: 2
                    totals:
                      subtotal:   { amount: 39998, currency: USD }
                      tax:        { amount: 3300, currency: USD }
                      shipping:   { amount: 0, currency: USD }
                      discount:   { amount: 0, currency: USD }
                      grandTotal: { amount: 43298, currency: USD }
                    trackingNumber: 1Z999AA10123456784
          responses:
            '2XX':
              description: Callback received.
